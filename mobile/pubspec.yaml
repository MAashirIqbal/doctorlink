name: doctorlink
description: "DoctorLink mobile client — book appointments, manage schedules and message your doctor."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.0
  iconsax: ^0.0.8
  pull_to_refresh_flutter3: ^2.0.2
  badges: ^3.1.2
  url_launcher: ^6.2.2
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

