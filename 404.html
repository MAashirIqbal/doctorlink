<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>DoctorLink</title>
  <script>
    // GitHub Pages has no rewrite rules, so a deep link such as /doctorlink/doctors/123
    // is served this 404 page instead of the app. Encode the requested route into a
    // query string and bounce to the app root; index.html decodes it back before React
    // Router mounts, so the user never sees the detour.
    //
    // pathSegmentsToKeep is the number of leading path segments that belong to the host
    // rather than the app: 1 for a project page (user.github.io/<repo>/), 0 for a user
    // page or a custom domain served from the root.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>

<body>
  <p>Redirecting…</p>
</body>

</html>
